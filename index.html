<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#fff7e6">
  <title>はもり</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app">
    <button id="btn-settings" class="gear" aria-label="設定（保護者用）">⚙</button>
    <!-- メイン画面（録音・再生・ハモリをすべてここで） -->
    <section id="screen-main" class="screen active">
      <canvas id="pitch-canvas" width="900" height="440"></canvas>
      <div class="controls main-controls">
        <button id="btn-record" class="big-round" aria-label="録音"><span class="mic">🎤</span></button>
        <div class="rec-status">
          <div class="meter" aria-hidden="true"><div id="meter-bar"></div></div>
          <div class="timer" id="timer">0</div>
        </div>
        <button id="btn-play" class="big-round play" aria-label="再生" disabled><span>▶</span></button>
      </div>
      <button id="btn-drums" class="wide-btn" aria-label="ドラムを ついか" disabled>🥁 ドラムを ついか</button>
      <div class="switches" id="switches"></div>
      <div class="speeds" id="speeds"></div>
      <div class="bottom-row">
        <button id="btn-favorite" class="pill star" aria-label="おきにいり" disabled>☆</button>
        <button id="btn-library" class="pill" aria-label="きろく">📚 きろく</button>
      </div>
      <div id="version" class="version"></div>
    </section>

    <!-- ドラム画面（声の録音のあとで、ドラムセットを打ち込む） -->
    <div id="screen-drums" class="drums-screen" hidden>
      <canvas id="drum-timeline" width="900" height="170"></canvas>
      <svg id="kit" class="kit" viewBox="0 0 400 360" role="group" aria-label="ドラムセット">
        <!-- スタンド（太鼓の後ろに隠れる） -->
        <g stroke="#8a8a8a" stroke-width="4" stroke-linecap="round">
          <line x1="78" y1="44" x2="78" y2="198"/><line x1="322" y1="44" x2="322" y2="196"/>
          <line x1="50" y1="166" x2="50" y2="352"/>
        </g>
        <g class="kit-piece" data-type="kick" role="button" aria-label="バスドラム">
          <circle cx="205" cy="306" r="46" fill="#b23a48"/><circle cx="205" cy="306" r="38" fill="#fdf6e3" stroke="#6b4226" stroke-width="3"/>
          <circle cx="205" cy="306" r="10" fill="#6b4226" opacity="0.25"/>
        </g>
        <g class="kit-piece" data-type="tomHigh" role="button" aria-label="タム（たかい）">
          <circle cx="150" cy="148" r="52" fill="#e76f51"/><circle cx="150" cy="148" r="43" fill="#fdf6e3" stroke="#9c3d2a" stroke-width="3"/>
        </g>
        <g class="kit-piece" data-type="tomMid" role="button" aria-label="タム（ひくい）">
          <circle cx="262" cy="148" r="54" fill="#d1495b"/><circle cx="262" cy="148" r="45" fill="#fdf6e3" stroke="#8f2f3d" stroke-width="3"/>
        </g>
        <g class="kit-piece" data-type="snare" role="button" aria-label="スネア">
          <circle cx="90" cy="258" r="58" fill="#4a90e2"/><circle cx="90" cy="258" r="48" fill="#fdf6e3" stroke="#2f5f9a" stroke-width="3"/>
          <line x1="52" y1="258" x2="128" y2="258" stroke="#2f5f9a" stroke-width="1.5" opacity="0.4"/>
        </g>
        <g class="kit-piece" data-type="tomFloor" role="button" aria-label="フロアタム">
          <circle cx="328" cy="260" r="62" fill="#9c3848"/><circle cx="328" cy="260" r="52" fill="#fdf6e3" stroke="#6a2531" stroke-width="3"/>
        </g>
        <g class="kit-piece" data-type="hihat" role="button" aria-label="ハイハット">
          <ellipse cx="50" cy="166" rx="50" ry="23" fill="transparent"/>
          <ellipse cx="50" cy="171" rx="48" ry="15" fill="#b89b3c"/><ellipse cx="50" cy="164" rx="48" ry="15" fill="#e3cc6a" stroke="#9c8530" stroke-width="2"/>
          <ellipse cx="50" cy="162" rx="10" ry="4" fill="#f3e39a"/>
        </g>
        <g class="kit-piece" data-type="crash" role="button" aria-label="クラッシュ">
          <ellipse cx="78" cy="42" rx="80" ry="34" fill="transparent"/>
          <ellipse cx="78" cy="44" rx="76" ry="25" fill="#e9b949" stroke="#b8860b" stroke-width="2.5"/><ellipse cx="78" cy="40" rx="15" ry="6" fill="#f6d77a" stroke="#b8860b" stroke-width="1.5"/>
        </g>
        <g class="kit-piece" data-type="ride" role="button" aria-label="ライド">
          <ellipse cx="322" cy="42" rx="80" ry="34" fill="transparent"/>
          <ellipse cx="322" cy="44" rx="76" ry="25" fill="#d4a017" stroke="#9a7410" stroke-width="2.5"/><ellipse cx="322" cy="40" rx="17" ry="7" fill="#edc94f" stroke="#9a7410" stroke-width="1.5"/>
        </g>
      </svg>
      <div class="drums-controls">
        <button id="btn-drums-undo" class="pill" aria-label="さいごの ろくおんを もどす" disabled>↩ もどす</button>
        <button id="btn-drums-rec" class="big-round drums-rec" aria-label="ドラムを ろくおん"><span>●</span></button>
        <button id="btn-drums-play" class="big-round play drums-play" aria-label="きく"><span>▶</span></button>
        <button id="btn-drums-clear" class="pill small" aria-label="ドラムを ぜんぶ けす" disabled>🗑 けす</button>
      </div>
      <button id="btn-drums-done" class="done-btn" aria-label="できた">✓ できた</button>
    </div>

    <!-- きろく一覧（シート） -->
    <div id="screen-library" class="sheet" hidden>
      <div class="sheet-panel">
        <div class="sheet-head"><h2 class="library-title">きろく</h2><button id="btn-library-back" class="pill" aria-label="とじる">とじる</button></div>
        <div id="library-list" class="library-list"></div>
      </div>
    </div>

    <!-- 処理中オーバーレイ -->
    <div id="busy" class="busy" hidden>
      <div class="spinner"></div>
      <div id="busy-text">おとを つくっているよ…</div>
    </div>

    <!-- 設定（保護者用） -->
    <div id="settings" class="settings" hidden>
      <div class="settings-panel">
        <h2>設定（おうちの人用） <small id="version-settings" class="version-inline"></small></h2>
        <label class="row">
          <span>じぶんの声の大きさ</span>
          <input id="level-original" type="range" min="0" max="120" step="5">
          <output id="level-original-value">70</output>
        </label>
        <label class="row">
          <span>ハモリの大きさ</span>
          <input id="level-harmony" type="range" min="0" max="120" step="5">
          <output id="level-harmony-value">90</output>
        </label>
        <h3>🥁 ドラム</h3>
        <label class="row">
          <span>大きさ</span>
          <input id="drum-level" type="range" min="0" max="120" step="5">
          <output id="drum-level-value"></output>
        </label>
        <label class="row">
          <span>音の高さ</span>
          <input id="drum-tune" type="range" min="60" max="160" step="5">
          <output id="drum-tune-value"></output>
        </label>
        <h3>シンバル</h3>
        <label class="row">
          <span>大きさ</span>
          <input id="cymbal-level" type="range" min="0" max="120" step="5">
          <output id="cymbal-level-value"></output>
        </label>
        <label class="row">
          <span>ひびきの長さ</span>
          <input id="cymbal-decay" type="range" min="40" max="250" step="10">
          <output id="cymbal-decay-value"></output>
        </label>
        <h3>ならべるハモリ</h3>
        <div id="preset-list" class="preset-list"></div>
        <p class="note">3度は曲のキーによって長・短が入れ替わるため、固定の3度はところどころ濁ります。設定は この端末だけに保存されます。</p>
        <div class="settings-actions">
          <button id="settings-reset" class="pill">はじめの設定にもどす</button>
          <button id="settings-close" class="pill primary">とじる</button>
        </div>
      </div>
    </div>

    <!-- エラー -->
    <div id="error" class="error" hidden></div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
