<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#fff7e6">
  <title>はもり</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app">
    <button id="btn-settings" class="gear" aria-label="設定（保護者用）">⚙</button>
    <!-- メイン画面（録音・再生・ハモリをすべてここで） -->
    <section id="screen-main" class="screen active">
      <div class="hint" id="record-hint">まるいボタンをおして、うたってね</div>
      <canvas id="pitch-canvas" width="900" height="440"></canvas>
      <div class="controls main-controls">
        <button id="btn-record" class="big-round" aria-label="録音"><span class="mic">🎤</span></button>
        <div class="rec-status">
          <div class="meter" aria-hidden="true"><div id="meter-bar"></div></div>
          <div class="timer" id="timer">0</div>
        </div>
        <button id="btn-play" class="big-round play" aria-label="再生" disabled><span>▶</span></button>
      </div>
      <div class="switches" id="switches"></div>
      <div class="speeds" id="speeds"></div>
      <div class="bottom-row">
        <button id="btn-favorite" class="pill star" aria-label="おきにいり" disabled>☆</button>
        <button id="btn-library" class="pill" aria-label="きろく">📚 きろく</button>
      </div>
      <div id="version" class="version"></div>
    </section>

    <!-- きろく一覧（シート） -->
    <div id="screen-library" class="sheet" hidden>
      <div class="sheet-panel">
        <div class="sheet-head"><h2 class="library-title">きろく</h2><button id="btn-library-back" class="pill" aria-label="とじる">とじる</button></div>
        <div id="library-list" class="library-list"></div>
      </div>
    </div>

    <!-- 処理中オーバーレイ -->
    <div id="busy" class="busy" hidden>
      <div class="spinner"></div>
      <div id="busy-text">おとを つくっているよ…</div>
    </div>

    <!-- 設定（保護者用） -->
    <div id="settings" class="settings" hidden>
      <div class="settings-panel">
        <h2>設定（おうちの人用） <small id="version-settings" class="version-inline"></small></h2>
        <label class="row">
          <span>じぶんの声の大きさ</span>
          <input id="level-original" type="range" min="0" max="120" step="5">
          <output id="level-original-value">70</output>
        </label>
        <label class="row">
          <span>ハモリの大きさ</span>
          <input id="level-harmony" type="range" min="0" max="120" step="5">
          <output id="level-harmony-value">90</output>
        </label>
        <h3>ならべるハモリ</h3>
        <div id="preset-list" class="preset-list"></div>
        <p class="note">3度は曲のキーによって長・短が入れ替わるため、固定の3度はところどころ濁ります。設定は この端末だけに保存されます。</p>
        <div class="settings-actions">
          <button id="settings-reset" class="pill">はじめの設定にもどす</button>
          <button id="settings-close" class="pill primary">とじる</button>
        </div>
      </div>
    </div>

    <!-- エラー -->
    <div id="error" class="error" hidden></div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
